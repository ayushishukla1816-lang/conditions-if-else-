<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <style>
          form{
            width: 300px;
            margin: 50px;
            padding: 20px;
            background-color: black;
            border-radius: 15px;
          }



          .operator {
          width: 60px;
          height: 50px;
          margin: 5px;
          font-size: 20px;
           border-radius: 8px;
           border: none;
           background-color: orange;
          color: white;
    
  }
           .input {
             width: 60px;
             height: 50px;
              margin: 5px;
              font-size: 20px;
              border: none;
            border-radius: 8px;
              background-color: white;
    
}

        .inputfiled{
          width: 300px;
          height: 50px;
          border-radius: 15px;
        }
        </style>


   <form action="">
      <input type="text" name="display" id="" class="inputfiled">
      <div class="button">
    <input type="button" value="1" name="" id="" onclick="display.value+='1'" class="input">
    <input type="button" value="2" name="" id="" onclick="display.value+='2'" class="input">
    <input type="button" value="3" name="" id="" onclick="display.value+='3'" class="input">
    <input type="button" value="4" name="" id="" onclick="display.value+='4'" class="input">
    <input type="button" value="5" name="" id="" onclick="display.value+='5'" class="input">
    <input type="button" value="6" name="" id="" onclick="display.value+='6'" class="input">
    <input type="button" value="7" name="" id="" onclick="display.value+='7'" class="input">
    <input type="button" value="8" name="" id="" onclick="display.value+='8'" class="input">
    <input type="button" value="9" name="" id="" onclick="display.value+='9'" class="input">
    <input type="button" value="0" name="" id="" onclick="display.value+='0'" class="input">
    <input type="button" value="AC" name="" id="" onclick="display.value='  '" class="operator" >
    <input type="button" value="+" name="" id="" onclick="display.value+='+'" class="operator">
    <input type="button" value="-" name="" id="" onclick="display.value+='-'" class="operator">
    <input type="button" value="*" name="" id="" onclick="display.value+='*'" class="operator">
    <input type="button" value="/" name="" id="" onclick="display.value+='/'" class="operator">
    <input type="button" value="%" name="" id="" onclick="display.value+='%'" class="operator">
    <input type="button" value="=" onclick="display.value=eval(display.value)" class="operator">
    <input type="button" value="DEL" name="" id="" onclick="display.value=display.value.slice(0,-1)" class="operator">
</div>
  



     

  </form> 

</body>
</html>
