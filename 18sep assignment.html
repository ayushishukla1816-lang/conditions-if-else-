//Q13. Convert Celsius to Fahrenheit — 2 Marks
//Create a function celsiusToFahrenheit(celsius) that converts Celsius into Fahrenheit and returns the result.
function celsiusToFahrenheit(celsius){

    return(c)
}
result=celsiusToFahrenheit(35)

//Q15. Calculate Grade — 2 Marks
//Create a function getGrade(marks) that returns: 90–100 → "A", 80–89 → "B", 70–79 → "C", 60–69 → "D", Below 60 → "F".
    function getGrade(marks){
        if(marks<100&&marks>90){
            return "A"
        }else if(marks>80&&marks<89){
            return "B"
        }else if(marks>70&&marks<79){
            return "C"
        }else if(marks>60&&marks<69){
            return "D"
        }else{
            return "Fail"
        }
    }
    result=getGrade(88)
    console.log(result)
    //answer=B
